<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Certificates by Ahmed Ehab">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1b2a4a"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/></pattern>
<style>
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.star{animation:tw 3s ease-in-out infinite}.s2{animation-delay:.8s}.s3{animation-delay:1.6s}
.medal{animation:fl 4s ease-in-out infinite;transform-origin:850px 130px}
.in{opacity:0;animation:fi .9s ease-out .2s forwards}.in2{opacity:0;animation:fi .9s ease-out .6s forwards}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fi{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.star,.medal,.in,.in2{animation:none;opacity:1}}
</style></defs>
<rect width="1000" height="260" rx="18" fill="url(#bg)"/><rect width="1000" height="260" rx="18" fill="url(#dots)"/>
<circle class="star" cx="620" cy="50" r="2.5" fill="#f5b83d"/><circle class="star s2" cx="700" cy="210" r="2" fill="#fff"/><circle class="star s3" cx="560" cy="170" r="1.8" fill="#8fa3c7"/><circle class="star s2" cx="930" cy="45" r="2.2" fill="#fff"/>
<text class="t in" x="64" y="112" font-size="54" font-weight="800" fill="#fff">Certificates</text>
<rect class="in" x="66" y="128" width="120" height="5" rx="2.5" fill="#f5b83d"/>
<text class="t in2" x="66" y="172" font-size="20" fill="#c5d2ec">Credentials and recognitions earned by Ahmed Ehab</text>
<text class="t in2" x="66" y="204" font-size="15" fill="#8fa3c7" font-family="monospace">AI Engineer · NASA Space Apps · ahmedehab.dev</text>
<g class="medal"><circle cx="850" cy="120" r="62" fill="none" stroke="#f5b83d" stroke-width="3"/><circle cx="850" cy="120" r="48" fill="#f5b83d" fill-opacity=".12" stroke="#f5b83d" stroke-opacity=".5"/>
<path d="M850 88l9.4 19 21 3-15.2 14.8 3.6 20.9L850 136l-18.8 9.7 3.6-20.9L819.6 110l21-3z" fill="#f5b83d"/>
<path d="M820 172l-12 42 26-12 16 20 8-44zM880 172l12 42-26-12-16 20-8-44z" fill="#2f4470"/></g>
</svg>
